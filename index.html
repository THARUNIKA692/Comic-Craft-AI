<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        ComicCraft - AI Comic Creator
    </title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>


<body class="page-bg">


<main class="container">


    <section class="hero">

        <span class="badge">
            AI COMIC STUDIO
        </span>


        <h1>
            ComicCraft
        </h1>


        <p>
            Turn your imagination into a
            five-panel AI comic.
        </p>

    </section>


    {% if error %}

    <div class="alert">

        {{ error }}

    </div>

    {% endif %}


    <form
        class="card form-card"
        action="/generate"
        method="post"
    >


        <label>

            Story Prompt

            <textarea
                name="story_prompt"
                required
                placeholder="Example: A brave fox explores an enchanted forest and discovers a mysterious glowing tree."
            ></textarea>

        </label>


        <div class="grid">


            <label>

                Main Character Name

                <input
                    type="text"
                    name="character_name"
                    placeholder="Luna"
                    required
                >

            </label>


            <label>

                Setting

                <select name="setting">

                    <option>
                        Enchanted Forest
                    </option>

                    <option>
                        School
                    </option>

                    <option>
                        Space
                    </option>

                    <option>
                        City
                    </option>

                    <option>
                        Village
                    </option>

                </select>

            </label>


            <label>

                Story Tone

                <select name="tone">

                    <option>
                        Light-hearted
                    </option>

                    <option>
                        Funny
                    </option>

                    <option>
                        Dramatic
                    </option>

                    <option>
                        Poetic
                    </option>

                    <option>
                        Adventure
                    </option>

                </select>

            </label>


            <label>

                Art Style

                <select name="art_style">

                    <option>
                        Comic Book
                    </option>

                    <option>
                        Anime
                    </option>

                    <option>
                        Pixel Art
                    </option>

                    <option>
                        Realistic
                    </option>

                    <option>
                        Watercolor
                    </option>

                </select>

            </label>


        </div>


        <button
            class="btn"
            type="submit"
        >

            Generate My Comic

        </button>


        <p class="hint">

            AI image generation may take
            several minutes.

        </p>


    </form>


</main>


</body>

</html>
